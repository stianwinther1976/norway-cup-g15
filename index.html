<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Norway Cup 2026 – G15 sluttspilltre</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --border:#e3e6ea;
    --ink:#1a2330; --ink2:#55606e; --ink3:#8a94a1;
    --accent:#2456b0; --accent-soft:#e8eefb;
    --win:#1a7f4e; --win-soft:#e6f4ec;
    --prov:#9a6b00; --prov-soft:#fdf3dc; --prov-border:#d9a520;
    --line:#c9cfd7;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --surface:#1b2129; --border:#2b333e;
      --ink:#e8ecf1; --ink2:#a7b0bb; --ink3:#71808f;
      --accent:#7ba3e8; --accent-soft:#1f2c44;
      --win:#5cc48f; --win-soft:#173527;
      --prov:#e3b74a; --prov-soft:#33290f; --prov-border:#a8842a;
      --line:#3a434f;
    }
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg); color:var(--ink); line-height:1.45; padding-bottom:48px;}
  header{background:var(--surface); border-bottom:1px solid var(--border); padding:20px 16px 14px;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 12px;}
  h1{font-size:1.35rem; letter-spacing:-0.01em;}
  h1 .sub{color:var(--accent); font-weight:700;}
  .meta{color:var(--ink2); font-size:0.82rem; margin-top:4px;}
  .meta a{color:var(--accent); text-decoration:none;}
  .note{margin:14px auto 0; max-width:1080px; padding:10px 14px; background:var(--prov-soft);
        border:1px solid var(--prov-border); border-radius:10px; color:var(--prov); font-size:0.88rem;}
  h2{font-size:1.05rem; margin:26px 0 10px; display:flex; align-items:center; gap:8px;}
  h2 .tag{font-size:0.7rem; font-weight:600; padding:2px 8px; border-radius:99px;
          background:var(--accent-soft); color:var(--accent);}
  /* ---- grupper ---- */
  .groups{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden;}
  .card h3{font-size:0.92rem; padding:10px 12px; border-bottom:1px solid var(--border);
           display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .status{font-size:0.68rem; font-weight:600; padding:2px 8px; border-radius:99px; white-space:nowrap;}
  .status.done{background:var(--win-soft); color:var(--win);}
  .status.live{background:var(--prov-soft); color:var(--prov);}
  table{width:100%; border-collapse:collapse; font-size:0.82rem;}
  th{color:var(--ink3); font-weight:600; font-size:0.7rem; text-transform:uppercase;
     letter-spacing:0.04em; padding:6px 6px; text-align:right;}
  th:first-child, td:first-child{text-align:left; padding-left:12px;}
  td{padding:6px 6px; text-align:right; border-top:1px solid var(--border);}
  td.team{font-weight:600; text-align:left; white-space:nowrap; overflow:hidden;
          text-overflow:ellipsis; max-width:150px;}
  tr.q td{background:var(--accent-soft);}
  tr.hl td{background:var(--accent); color:#fff;}
  td.pts{font-weight:700;}
  /* ---- sluttspill ---- */
  .bracket-scroller{overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:8px;}
  .bracket{display:flex; gap:36px; position:relative; min-width:min-content;}
  .round{width:216px; flex:none; position:relative; z-index:1;}
  .round h4{font-size:0.74rem; color:var(--ink3); text-transform:uppercase;
            letter-spacing:0.05em; height:18px; margin:0 0 10px; text-align:center;}
  .rwrap{position:relative;}
  svg.connectors{position:absolute; left:0; top:28px; z-index:0; pointer-events:none;}
  svg.connectors path{stroke:var(--line); stroke-width:2; fill:none;}
  .match{background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden;
         position:absolute; left:0; right:0; transform:translateY(-50%);}
  .match .mtime{font-size:0.68rem; color:var(--ink3); padding:4px 10px 0;}
  .side{display:flex; justify-content:space-between; align-items:center; gap:8px;
        padding:7px 10px; font-size:0.85rem;}
  .side + .side{border-top:1px solid var(--border);}
  .side .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:165px;}
  .side.winner .nm{font-weight:700; color:var(--win);}
  .side.winner{background:var(--win-soft);}
  .side .sc{font-variant-numeric:tabular-nums; font-weight:700; min-width:18px; text-align:right;}
  .side.prov .nm{color:var(--prov); font-style:italic; font-weight:500;}
  .side.click{cursor:pointer;}
  .side.click:active{background:var(--accent-soft);}
  .match.prov{border-style:dashed; border-color:var(--prov-border);}
  .slotlbl{display:block; font-size:0.64rem; color:var(--ink3); font-style:normal;}
  .legend{margin-top:14px; font-size:0.78rem; color:var(--ink2); display:flex; flex-wrap:wrap; gap:14px;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .chip{width:14px; height:14px; border-radius:4px; display:inline-block; flex:none;}
  .chip.prov{border:2px dashed var(--prov-border); background:var(--prov-soft);}
  .chip.done{background:var(--win-soft); border:2px solid var(--win);}
  footer{margin-top:34px; text-align:center; color:var(--ink3); font-size:0.75rem;}
  /* ---- popup ---- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:50;
           display:flex; align-items:center; justify-content:center; padding:18px;}
  .overlay .card{width:100%; max-width:430px; max-height:82vh; overflow:auto;
                 box-shadow:0 12px 40px rgba(0,0,0,0.35);}
  .overlay .close{background:none; border:none; color:var(--ink3); font-size:1.3rem;
                  line-height:1; cursor:pointer; padding:2px 4px;}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </div>
</header>
<div class="wrap">
  <div class="note" id="note" style="display:none"></div>
  <section id="brackets"></section>
  <div class="legend">
    <span><span class="chip done"></span> Avgjort / vinner</span>
    <span><span class="chip prov"></span> Foreløpig – gruppa er ikke ferdigspilt</span>
    <span>👆 Trykk på et lag i treet for å se gruppetabellen</span>
  </div>
  <section id="groups-section">
    <h2>Gruppespill</h2>
    <div class="groups" id="groups"></div>
  </section>
  <footer id="footer"></footer>
</div>

<script src="data.js"></script>
<script>
function renderAll(D){
  const R = D.rules || {win:3, draw:1, loss:0};
  document.getElementById('brackets').innerHTML = '';
  document.getElementById('groups').innerHTML = '';
  document.querySelectorAll('.overlay').forEach(o => o.remove());

  /* ---------- standings ----------
     Tabellrader kommer ferdig sortert fra offisiell kilde:
     [navn, V, U, T, mål for, mål mot] */
  function computeStandings(g){
    const rows = g.table.map(r => ({
      team:r[0], w:r[1], d:r[2], l:r[3], gf:r[4], ga:r[5],
      pl:r[1]+r[2]+r[3],
      pts:R.win*r[1] + R.draw*r[2] + R.loss*r[3]
    }));
    const playedCount = rows.reduce((s,r)=>s+r.pl,0)/2;
    const total = g.totalMatches || 6;
    const finished = g.finished === true || playedCount >= total;
    return {rows, finished, playedCount, total};
  }

  const standings = {};
  const groupById = {};
  (D.groups||[]).forEach(g => { standings[g.id] = computeStandings(g); groupById[g.id] = g; });

  /* ---------- slot resolution ---------- */
  const allMatches = {};
  (D.brackets||[]).forEach(b => b.rounds.forEach(r => r.matches.forEach(m => allMatches[m.id]=m)));

  function resolveSlot(slot){
    if(!slot || slot.type === "tbd") return {name:"—", provisional:true, label:(slot && slot.label) || "ukjent"};
    if(slot.type === "team") return {name:slot.name, provisional:false, label:""};
    if(slot.type === "group"){
      const st = standings[slot.group];
      const label = slot.pos + ". i gruppe " + slot.group + (slot.note ? " · " + slot.note : "");
      if(!st) return {name:"—", provisional:true, label};
      const row = st.rows[slot.pos-1];
      if(!row || st.playedCount === 0) return {name:"—", provisional:true, label, groupId:slot.group};
      return {name:row.team, provisional:!st.finished, label, groupId:slot.group};
    }
    if(slot.type === "winner" || slot.type === "loser"){
      const m = allMatches[slot.match];
      const label = (slot.type==="winner"?"Vinner ":"Taper ") + slot.match;
      if(!m) return {name:"—", provisional:false, label};
      if(m.hs == null || m.as == null || m.hs === m.as) return {name:"—", provisional:false, label};
      const homeWon = m.hs > m.as;
      const side = (slot.type === "winner") === homeWon ? m.home : m.away;
      const res = resolveSlot(side);
      return {name:res.name, provisional:res.provisional, label, groupId:res.groupId};
    }
    return {name:"—", provisional:false, label:""};
  }

  function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  /* ---------- header ---------- */
  document.getElementById('title').innerHTML =
    esc(D.meta.title) + ' <span class="sub">' + esc(D.meta.subtitle) + '</span>';
  document.getElementById('meta').innerHTML =
    'Sist oppdatert: ' + esc(D.meta.updated) +
    (D.meta.sourceUrl ? ' · <a href="'+D.meta.sourceUrl+'" target="_blank" rel="noopener">Offisielle resultater ↗</a>' : '');
  document.title = D.meta.title + " – " + D.meta.subtitle;
  if(D.meta.note){
    const n = document.getElementById('note');
    n.textContent = D.meta.note; n.style.display = 'block';
  }
  document.getElementById('footer').textContent =
    'Uoffisiell resultatside · data legges inn manuelt fra Norway Cups offisielle sider';

  /* ---------- gruppekort (brukes både i lista og i popup) ---------- */
  function makeGroupCard(g, highlightTeam){
    const st = standings[g.id];
    let html = '<h3><span>'+esc(g.name)+'</span><span style="display:flex;align-items:center;gap:8px;">'
      + '<span class="status '+(st.finished?'done':'live')+'">'
      + (st.finished ? 'Ferdigspilt' : st.playedCount + '/' + st.total + ' kamper spilt') + '</span>'
      + (highlightTeam !== undefined ? '<button class="close" aria-label="Lukk">✕</button>' : '')
      + '</span></h3>';
    html += '<table><thead><tr><th>Lag</th><th>K</th><th>V</th><th>U</th><th>T</th><th>+/−</th><th>P</th></tr></thead><tbody>';
    st.rows.forEach((r,i) => {
      const cls = (highlightTeam && r.team === highlightTeam) ? 'hl' : (i<2 ? 'q' : '');
      html += '<tr class="'+cls+'"><td class="team">'+(i+1)+'. '+esc(r.team)+'</td><td>'+r.pl+'</td><td>'+r.w+'</td><td>'+r.d+'</td><td>'+r.l+'</td><td>'+(r.gf-r.ga>0?'+':'')+(r.gf-r.ga)+'</td><td class="pts">'+r.pts+'</td></tr>';
    });
    html += '</tbody></table>';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = html;
    return card;
  }

  const groupsEl = document.getElementById('groups');
  (D.groups||[]).forEach(g => groupsEl.appendChild(makeGroupCard(g)));

  /* ---------- popup ---------- */
  function showGroup(gid, teamName){
    const g = groupById[gid];
    if(!g) return;
    const ov = document.createElement('div');
    ov.className = 'overlay';
    const card = makeGroupCard(g, teamName || null);
    ov.appendChild(card);
    function closeIt(){ ov.remove(); }
    ov.addEventListener('click', e => { if(e.target === ov) closeIt(); });
    card.querySelector('.close').addEventListener('click', closeIt);
    document.body.appendChild(ov);
  }

  /* ---------- sluttspilltre ---------- */
  const COLW = 216, GAP = 36, RH = 136, HEADER = 28;
  const brEl = document.getElementById('brackets');

  (D.brackets||[]).forEach(b => {
    const h2 = document.createElement('h2');
    h2.innerHTML = esc(b.name) + ' <span class="tag">sluttspill</span>';
    brEl.appendChild(h2);
    if(b.pending){
      const p = document.createElement('div');
      p.className = 'note';
      p.style.margin = '0';
      p.textContent = b.pending;
      brEl.appendChild(p);
      return;
    }

    const rounds = b.rounds;
    // grunnrunden = runden med flest kamper
    let baseIdx = 0;
    rounds.forEach((r,i) => { if(r.matches.length > rounds[baseIdx].matches.length) baseIdx = i; });
    const H = rounds[baseIdx].matches.length * RH;

    // posisjoner: id -> {col, y}
    const pos = {};
    rounds[baseIdx].matches.forEach((m,i) => pos[m.id] = {col:baseIdx, y:i*RH + RH/2});
    for(let c = baseIdx-1; c >= 0; c--){
      rounds[c].matches.forEach(m => {
        const t = rounds[c+1].matches.find(x => [x.home,x.away].some(s => s && s.type==="winner" && s.match===m.id));
        pos[m.id] = {col:c, y: t ? pos[t.id].y : RH/2};
      });
    }
    for(let c = baseIdx+1; c < rounds.length; c++){
      rounds[c].matches.forEach(m => {
        const feeders = [m.home,m.away].filter(s => s && s.type==="winner").map(s => pos[s.match]).filter(Boolean);
        const y = feeders.length ? feeders.reduce((a,p)=>a+p.y,0)/feeders.length : H/2;
        pos[m.id] = {col:c, y};
      });
    }
    const colX = c => c*(COLW+GAP);
    const totalW = rounds.length*COLW + (rounds.length-1)*GAP;

    const scroller = document.createElement('div');
    scroller.className = 'bracket-scroller';
    const bracket = document.createElement('div');
    bracket.className = 'bracket';
    bracket.style.height = (H + HEADER) + 'px';

    // koblingslinjer
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','connectors');
    svg.setAttribute('width', totalW);
    svg.setAttribute('height', H);
    let paths = '';
    rounds.forEach(r => r.matches.forEach(m => {
      [m.home, m.away].forEach(s => {
        if(s && s.type === "winner" && pos[s.match]){
          const f = pos[s.match], t = pos[m.id];
          const x1 = colX(f.col) + COLW, y1 = f.y, x2 = colX(t.col), y2 = t.y;
          const mx = x2 - GAP/2;
          paths += '<path d="M '+x1+' '+y1+' H '+mx+' V '+y2+' H '+x2+'"/>';
        }
      });
    }));
    svg.innerHTML = paths;
    bracket.appendChild(svg);

    rounds.forEach((r, ci) => {
      const col = document.createElement('div');
      col.className = 'round';
      col.innerHTML = '<h4>'+esc(r.name)+'</h4>';
      const box = document.createElement('div');
      box.className = 'rwrap';
      box.style.height = H + 'px';
      r.matches.forEach(m => {
        const hRes = resolveSlot(m.home), aRes = resolveSlot(m.away);
        const decided = m.hs!=null && m.as!=null;
        const hWin = decided && m.hs>m.as, aWin = decided && m.as>m.hs;
        const provisional = hRes.provisional || aRes.provisional;
        const el = document.createElement('div');
        el.className = 'match' + (provisional ? ' prov' : '');
        el.style.top = pos[m.id].y + 'px';
        el.innerHTML =
          (m.time ? '<div class="mtime">'+esc(m.time)+'</div>' : '') +
          sideHtml(hRes, m.hs, hWin) + sideHtml(aRes, m.as, aWin);
        el.querySelectorAll('.side.click').forEach(sd => {
          sd.addEventListener('click', () => showGroup(sd.dataset.group, sd.dataset.team));
        });
        box.appendChild(el);
      });
      col.appendChild(box);
      bracket.appendChild(col);
    });
    scroller.appendChild(bracket);
    brEl.appendChild(scroller);
  });

  function sideHtml(res, score, won){
    const clickable = !!res.groupId && res.name !== "—";
    const cls = 'side' + (won ? ' winner' : '') + (res.provisional ? ' prov' : '') + (clickable ? ' click' : '');
    const data = clickable ? ' data-group="'+esc(res.groupId)+'" data-team="'+esc(res.name)+'"' : '';
    const lbl = res.label ? '<span class="slotlbl">'+esc(res.label)+(res.provisional?' · foreløpig':'')+'</span>' : '';
    return '<div class="'+cls+'"'+data+'><span class="nm">'+esc(res.name)+lbl+'</span><span class="sc">'+(score!=null?score:'')+'</span></div>';
  }
}

/* Første visning fra data.js som fulgte med siden */
renderAll(window.DATA);

/* Auto-oppdatering: hent ferske data forbi all caching, hvert 90. sekund */
(function(){
  if(!location.protocol.startsWith('http')) return;
  let current = (window.DATA.meta && window.DATA.meta.updated) || '';
  async function refresh(){
    try{
      const res = await fetch('data.js?_=' + Date.now(), {cache:'no-store'});
      if(!res.ok) return;
      const txt = await res.text();
      const fresh = new Function(txt + '\n;return DATA;')();
      if(fresh && fresh.meta && fresh.meta.updated !== current){
        current = fresh.meta.updated;
        window.DATA = fresh;
        renderAll(fresh);
      }
    }catch(e){ /* stille – prøver igjen */ }
  }
  refresh();
  setInterval(refresh, 90000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) refresh(); });
})();
</script>
</body>
</html>
